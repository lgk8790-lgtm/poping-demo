<style>
/* Color roles. Orange = the one action you came to this screen for (one per screen).
   Lime = confirmed or live (you're in, live now, checked in). Lilac = your people (friends going, private invites).
   Pink = urgent (sold out, few left, cancelled). Event-type colors appear only on event content (flyers, type dots).
   Everything else is ink and paper. */
/* Layout: one phone-width column; every event's flyer carries the color, the app stays quiet.
   Two looks: day (cream, ink outlines) and night (near-black). Auto picks by local time; Profile can pin one. */
:root{
  --night:#0F0D0C; --smoke:#1B1817; --smoke2:#2A2522; --line:#3A3430; --ash:#A8A096; --paper:#F6F0E4; --paper2:#E6DFD2;

  --display:"Archivo","Arial Narrow",Impact,sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --bg:var(--night); --fg:var(--paper); --fg2:#E2DBD0; --shadow:var(--paper); --navbg:rgba(15,13,12,.96); --focus:var(--lime);
  --t-lime:var(--lime); --t-lilac:var(--lilac); --t-pink:var(--pink); --t-peach:var(--peach); --t-pop:var(--pop);
  color-scheme:dark;
}
:root[data-theme="day"]{
  --bg:#F6F0E4; --fg:#0F0D0C; --fg2:#3A3430; --smoke:#FFFDF8; --smoke2:#E4DCCD; --line:#CDC4B4; --ash:#635C53; --shadow:#0F0D0C; --navbg:rgba(246,240,228,.96); --focus:#0F0D0C;
  --t-lime:#3D7A0A; --t-lilac:#5B3FD0; --t-pink:#C2206A; --t-peach:#B5440D; --t-pop:#D2410A;
  color-scheme:light;
}
:root[data-theme="day"] :is(.listrow,.card,.stat,.info div,details.faq){box-shadow:inset 0 0 0 1.5px var(--night)}
html,body{background:var(--bg);color:var(--fg);transition:background .4s}
body{font-family:var(--body);font-size:15px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
*{box-sizing:border-box}

a{color:var(--t-pop)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.app{max-width:440px;margin:0 auto;min-height:100vh;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 110px;display:flex;flex-direction:column;gap:14px}
.d{font-family:var(--display);font-weight:900;font-stretch:62%;text-transform:uppercase;letter-spacing:-.5px;line-height:.86;text-wrap:balance}
.dw{font-family:var(--display);font-weight:900;font-stretch:75%}
.muted{color:var(--ash)} .small{font-size:12px}

.stack .top{position:absolute;inset:8px 8px auto 8px;height:300px;border-radius:22px;box-shadow:0 6px 0 var(--night);transition:transform .25s cubic-bezier(.2,1.4,.4,1)}
.stack .top:hover{transform:rotate(-1deg) translateY(-2px)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--navbg);border-top:1px solid var(--smoke2);padding:6px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));backdrop-filter:blur(8px)}
.nav .in{max-width:440px;margin:0 auto;display:flex;justify-content:space-around}
.nav a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--ash);min-width:64px;padding:6px 0;text-decoration:none;position:relative}

.scrim{position:fixed;inset:0;background:rgba(15,13,12,.7);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:440px;background:var(--paper);color:var(--night);border-radius:28px 28px 0 0;border-top:2px solid var(--night);padding:10px max(20px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow-y:auto;animation:up .25s ease-out}

/* ---- motion: springy, short, never in the way; all of it switches off under reduced motion ---- */

/* The overlay layer has three parts updated separately, so a toast or a live data update never rebuilds an open sheet
   (rebuilding replayed its slide-in animation and swallowed taps on Pay). */
let LSH={html:null,obj:null,toast:null,push:null};
function renderLayer(){
  const L=$("#layer"); if(!L.firstChild){ L.innerHTML='<div id="lsheet"></div><div id="ltoast"></div><div id="lpush"></div>'; }
  const ae=document.activeElement, keepSend=ae&&ae.id==="sendQ";
  const sh=sheetHTML();
  if(sh!==LSH.html){
    const host=$("#lsheet"), same=S.sheet&&S.sheet===LSH.obj&&LSH.html;
    const prevScroll=host.querySelector(".sheet")?.scrollTop||0;
    host.innerHTML=sh;
    if(same){ host.querySelectorAll(".sheet,.dlg").forEach(x=>x.classList.add("still")); const nsh=host.querySelector(".sheet"); if(nsh) nsh.scrollTop=prevScroll; }
    LSH.html=sh; LSH.obj=S.sheet;
    fillSendNames(); paintWallet();
  }
  const th=(S.toast?`<div class="toast" role="status">${esc(S.toast)}</div>`:"");
  if(th!==LSH.toast){ $("#ltoast").innerHTML=th; LSH.toast=th; }
  const ph=(S.push?`<button class="push" data-act="push" role="status"><span class="pi">pop<b style="color:#F6F0E4">.</b></span><span style="flex:1;min-width:0"><b style="font-size:13px">POPING</b> <span style="font-size:11px;color:#A8A096">now</span><br><b style="font-size:14px">${esc(S.push.title)}</b><br><span style="font-size:13px;color:#E2DBD0">${esc(S.push.body)}</span></span></button>`:"");
  if(ph!==LSH.push){ $("#lpush").innerHTML=ph; LSH.push=ph; }
  if(keepSend){ const i=$("#sendQ"); if(i && document.activeElement!==i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length); } }
}
function fillSendNames(){ const sh=S.sheet; if(!sh||sh.type!=="send") return; document.querySelectorAll('[data-act="send-to"]').forEach(b=>{ const h=(sh.hits||[]).find(x=>x.id===b.dataset.v); const sp=b.querySelector(".grow"); if(h&&sp) sp.textContent=h.name||"Someone"; }); }

/* ---------- motion helpers ---------- */
const RM = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
function dropText(t){ return String(t).split("").map((c,k)=>c===" "?" ":`<span aria-hidden="true" style="--k:${k}">${esc(c)}</span>`).join(""); }
function tickerHTML(){
  const L=listed(), now=Date.now();
  const live=L.filter(e=>sMs(e)<=now&&eMs(e)>now).length, tonight=L.filter(e=>inWhen(e,"today")).length, free=L.filter(e=>!(e.price>0)&&inWhen(e,"week")).length;
  const fr=L.filter(e=>visibleHolders(e.id).some(i=>i!==S.me.id)).length, types=new Set(L.filter(e=>inWhen(e,"week")).map(e=>e.type)).size;
  const items=[live?live+" happening right now":"", tonight?tonight+" on today":"", free?free+" free this week":"", fr?"your people are going to "+fr:"", types>2?types+" kinds of things this week":"", "all-in prices, no surprise fees", "downtown nyc"].filter(Boolean);
  const run=items.map(x=>`<span>${esc(x)}</span>`).join("");
  return `<div class="ticker" aria-label="${esc(items.join(". "))}"><div class="tk" aria-hidden="true">${run}${run}</div></div>`;
}
function burst(x,y,cols){
  if(RM()) return; cols=cols||["#FF5FA8","#FF5B1F","#D4FF3A","#B9A6FF","#7CCBFF"];
  for(let k=0;k<14;k++){ const d=document.createElement("span"); d.className="spk"; const a=Math.PI*2*k/14, r=40+Math.random()*40;
    d.style.cssText=`left:${x-5}px;top:${y-5}px;background:${cols[k%cols.length]};--dx:${Math.cos(a)*r}px;--dy:${Math.sin(a)*r}px;--r:${Math.random()*360}deg`;
    document.body.appendChild(d); setTimeout(()=>d.remove(),750); }
}
function flyOut(dir){
  const t=document.querySelector(".stack .top");
  const done=()=>{ S.flying=false; S.stack++; S.dealt=true; render(); S.dealt=false; };
  S.flying=true;
  if(!t||RM()){ done(); return; }
  t.classList.add("fly"); t.style.transform=`translateX(${dir*520}px) rotate(${dir*28}deg)`; t.style.opacity="0";
  document.querySelectorAll(".stack .back").forEach((b,k)=>{ b.style.transform=k? "rotate(-2deg) translateX(-2px)" : "rotate(2deg)"; });
  setTimeout(done,300);
}
function bindStack(){
  const t=document.querySelector(".stack .top"); if(!t) return;
  let x0=0,y0=0,dx=0,on=false,moved=false;
  const yes=t.querySelector(".stamp.yes"), no=t.querySelector(".stamp.no");
  t.addEventListener("pointerdown",(e)=>{ if(e.button>0) return; on=true; moved=false; x0=e.clientX; y0=e.clientY; dx=0; t.classList.add("dragging"); });
  t.addEventListener("pointermove",(e)=>{ if(!on) return; dx=e.clientX-x0; const dy=e.clientY-y0;
    if(!moved && Math.abs(dx)<8) return; if(!moved && Math.abs(dy)>Math.abs(dx)){ on=false; t.classList.remove("dragging"); return; }
    if(!moved){ moved=true; try{ t.setPointerCapture(e.pointerId); }catch(err){} }
    t.style.transform=`translateX(${dx}px) rotate(${dx/16}deg)`;
    if(yes) yes.style.opacity=Math.max(0,Math.min(1,dx/90)); if(no) no.style.opacity=Math.max(0,Math.min(1,-dx/90)); });
  const end=()=>{ if(!on) return; on=false; t.classList.remove("dragging");
    if(moved && Math.abs(dx)>90){ const id=t.dataset.id;
      if(dx>0 && id && S.me.id && !savedIds().includes(id)){ const r=t.getBoundingClientRect(); burst(r.left+r.width/2,r.top+r.height/2); saveProfile({saved:savedIds().concat([id]).slice(-200)}); toast("Saved. It's in Tickets."); }
      flyOut(dx>0?1:-1); }
    else { t.style.transform=""; if(yes) yes.style.opacity=0; if(no) no.style.opacity=0; } };
  t.addEventListener("pointerup",end); t.addEventListener("pointercancel",end);
  t.addEventListener("dragstart",(e)=>e.preventDefault());
  t.addEventListener("click",(e)=>{ if(moved){ e.preventDefault(); e.stopPropagation(); moved=false; } },true);
}

let tickTimer=null;
function paintTicket(){
  clearInterval(tickTimer);
  const t=S.tickets.find(x=>x.id===S.param); if(!t||t.status==="refunded") return;
  const e=evById(t.eventId), rot=!!(e&&e.rotating); let lastW=null;
  const paint=()=>{
    if(S.route!=="ticket"){ clearInterval(tickTimer); return; }
    const w=rot?win():"s", left=15-Math.floor((Date.now()/1000)%15);
    if(w!==lastW){ lastW=w; const code=codeFor(t.id,w); const el=$("#doorCode"); if(el) el.textContent=code.slice(0,3)+" "+code.slice(3);
      const box=$("#qr"); if(box && window.qrcode){ try{ const qr=window.qrcode(0,"M"); qr.addData("POPING:"+t.id+":"+code); qr.make(); box.innerHTML='<img alt="" src="'+qr.createDataURL(8,0)+'" style="width:100%;height:100%;image-rendering:pixelated">'; }catch(err){ box.textContent=code; } } else if(box){ box.textContent=code; } }
    if(!rot) return;

/* ---------- confetti ---------- */
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let c=$("#confetti"); if(!c){ c=document.createElement("canvas"); c.id="confetti"; document.body.appendChild(c); }
  const ctx=c.getContext("2d"), W=c.width=innerWidth, H=c.height=innerHeight, cols=["#FF5FA8","#0F0D0C","#FF5B1F","#7CCBFF","#B9A6FF","#F6F0E4"];
  const P=Array.from({length:120},()=>({x:Math.random()*W,y:-20-Math.random()*H*0.6,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,w:6+Math.random()*8,h:4+Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)]}));
  let f=0; const step=()=>{ ctx.clearRect(0,0,W,H); P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();}); if(++f<220 && S.route==="yay") requestAnimationFrame(step); else ctx.clearRect(0,0,W,H); };
  step();
}

async function pay(){

async function sendTo(uid){

async function createParty(){
  const f=S.form, name=f.name.trim(), editing=!!S.editId;
  if(!S.db||!S.me.id){ f.err="Sign in to post an event."; return render(); }
  if(!name){ f.err="Give your event a name."; return render(); }
  const starts=new Date(f.date+"T"+(f.time||"20:00"));
  if(isNaN(starts.getTime())){ f.err="Pick a start date and time."; return render(); }
  let ends=null; if(f.endDate||f.endTime){ ends=new Date((f.endDate||f.date)+"T"+(f.endTime||"23:59")); if(isNaN(ends.getTime())||ends<=starts){ f.err="End has to be after the start."; return render(); } }
  if((ends?ends.getTime():starts.getTime()+6*HOUR)<Date.now()){ f.err="That date has passed."; return render(); }
  const listen=f.listenUrl.trim(); if(listen && !safeUrl(listen)){ f.err="The link should start with https://"; return render(); }
  const price=Math.max(0,Math.min(500,Math.round(Number(f.price)||0))), cap=Math.max(1,Math.min(5000,Math.round(Number(f.capacity)||100)));
  const prev=editing?evById(S.editId):null;
  if(f.banBusy){ f.err="Hang on, your image is still uploading."; return render(); }
  if(prev && cap<soldOf(prev.id)){ f.err="Capacity can't go below the "+soldOf(prev.id)+" people already going."; return render(); }
  const code = f.public ? "" : (prev&&prev.code) || ((name.replace(/[^A-Za-z]/g,"").slice(0,4).toUpperCase()||"EVNT") + String(Math.floor(10+Math.random()*90)));
  const ev={name,hostName:(f.hostName||"").trim()||S.me.name||"Organizer",hostId:S.me.id,type:f.type,sound:f.type==="party"?f.sound:"",startsAt:starts.toISOString(),endsAt:ends?ends.toISOString():"",hours:(f.hours||"").trim(),venue:f.venue.trim(),address:f.address.trim(),area:f.area.trim(),age:f.age,price,capacity:cap,color:f.color,deco:f.deco,public:!!f.public,rotating:!!f.rotating,code,lineup:f.lineup.trim(),listenUrl:listen,dress:f.dress.trim(),door:f.door.trim(),blurb:f.blurb.trim(),status:"live",createdAt:prev?prev.createdAt:Date.now(),updatedAt:Date.now()};
  try{
    const id=editing?S.editId:makeId("e");
    if(editing){ const keep={verified:prev.verified||false}; await S.db.doc("events/"+id).set(Object.assign({},ev,keep)); const i=S.events.findIndex(x=>x.id===id); if(i>=0) S.events[i]=Object.assign({id},ev,keep); }
    else { await S.db.doc("events/"+id).set(ev); S.events.push(Object.assign({id},ev)); }
    let banFail=false;
    if(f.banChanged){ try{ if(f.banner){ const b={src:f.banner,eventId:id,by:S.me.id,at:Date.now()}; await S.db.doc("banners/"+id).set(b); S.banners[id]=b; } else if(S.banners[id]){ await S.db.doc("banners/"+id).delete(); delete S.banners[id]; } }catch(err){ banFail=true; } }
    if(banFail) setTimeout(()=>toast("Event saved, but the image didn't upload. Try a smaller one from Edit."),300);
    S.form=null; const wasEdit=editing; S.editId=null; if(wasEdit){ toast("Saved. Guests see the update."); go("h-"+id); } else go("live-"+id);
  }catch(err){ f.err="Couldn't save. Try again."; render(); }
}
async function letIn(t,how){
  const done=t.checkedIn||0;

  try{ await S.db.doc("tickets/"+t.id).update({checkedIn:done+1}); t.checkedIn=done+1; S.doorMsg={ok:true,text:`Let them in: ${t.comp?t.guestName:nameOf(t.holderId)}, ${done+1} of ${t.qty}${how==="name"?" (check ID)":""}.`}; }
  catch(err){ S.doorMsg={ok:false,text:"Couldn't save the check-in. Try again."}; }
  render();
}
function checkDoor(raw){
  const e=evById(S.param); if(!e) return;
  let code=String(raw||"").toUpperCase().replace(/\s+/g,""), tid=null;
  const m=code.match(/^POPING:([^:]+):([A-Z0-9]{6})$/i); if(m){ tid=m[1]; code=m[2].toUpperCase(); }
  const w=win(), wins=e.rotating?[w,w-1,w-2,w-3]:["s"];
  const hit=activeTix().filter(t=>t.eventId===e.id&&(!tid||t.id===tid)).find(t=>wins.some(x=>codeFor(t.id,x)===code));
  if(!hit){ S.doorMsg={ok:false,text:"No match. Ask for their name and search the guest list below."}; return render(); }
  letIn(hit,"code");
}

  if(a==="vis"){ saveProfile({visibility:v}).then(softRender); render(); return; }
  if(a==="onb-next"){ if(S.onb.step===1 && S.onb.types.length<2) return; S.onb.step++; render(); return; }
  if(a==="onb-type"){ const s=S.onb.types; S.onb.types=s.includes(v)?s.filter(x=>x!==v):s.concat([v]); render(); return; }
  if(a==="onb-vis"){ S.onb.vis=v; render(); return; }
  if(a==="onb-done"){ saveProfile({types:S.onb.types,visibility:S.onb.vis,onboarded:true,following:following(),saved:savedIds()}); S.onb={step:0,types:[],vis:"everyone"}; go("discover"); if(DEMO&&!DEMO.session().welcomed){ DEMO.setSession({welcomed:true}); setTimeout(()=>{ const e=listed().find(x=>visibleHolders(x.id).some(i=>i!==S.me.id)); if(e) pushN(nameOf(visibleHolders(e.id).find(i=>i!==S.me.id)).split(" ")[0]+" is going to "+e.name, fmtWhen(e)+". Tap to see who else.", "p-"+e.id); },3500); } return; }
  if(a==="onb-skip"){ S.skipOnb=true; if(S.me.id) saveProfile({onboarded:true,types:[],visibility:"everyone",following:[]}); go("discover"); return; }
  if(a==="ftype"){ S.form.type=v; if(!S.form.colorTouched) S.form.color=typeOf(v).c; render(); return; }
  if(a==="fcolor"){ S.form.color=v; S.form.colorTouched=true; const p=$("#preview"); if(p) p.innerHTML=previewHTML(); document.querySelectorAll('[data-act="fcolor"]').forEach(b=>{const on=b.dataset.v===v;b.setAttribute("aria-pressed",on);b.style.border=on?"3px solid var(--fg)":"2px solid var(--night)";}); return; }
  if(a==="fdeco"){ S.form.deco=v; const p=$("#preview"); if(p) p.innerHTML=previewHTML(); document.querySelectorAll('[data-act="fdeco"]').forEach(b=>b.classList.toggle("on",b.dataset.v===v)); return; }
  if(a==="push"){ const p=S.push; S.push=null; renderLayer(); if(p){ if(p.fill && S.route==="otp"){ const i=$("#otpIn"); if(i){ i.value=p.fill; i.dispatchEvent(new Event("input",{bubbles:true})); } } else if(p.href) go(p.href); } return; }
  if(a==="install"){ S.inst=1; render(); const iv=setInterval(()=>{ S.inst=Math.min(100,S.inst+4+Math.floor(Math.random()*7)); if(S.inst>=100) clearInterval(iv); if(S.route==="store") render(); },90); return; }
  if(a==="openapp"){ go("splash"); return; }
  if(a==="resend"){ const a2=S.auth||(S.auth={}); a2.code=String(100000+Math.floor(Math.random()*900000)); a2.bad=false; render(); setTimeout(()=>pushN("Your Poping code is "+a2.code,"It expires in 10 minutes. Tap to fill it in.",null,a2.code),700); return; }
  if(a==="perm"){ S.sheet={type:"perm",kind:v}; renderLayer(); return; }
  if(a==="perm-yes"||a==="perm-no"){ const k=S.sheet&&S.sheet.kind, yes=a==="perm-yes"; S.sheet=null; renderLayer();
    if(k==="contacts"){ S.auth=S.auth||{}; if(yes){ S.auth.contacts=true; render(); } else go("notifs"); }
    if(k==="notifs"){ DEMO&&DEMO.setSession({notifs:yes}); finishAuth(); } return; }
  if(a==="auth-next"){ go(v); return; }
  if(a==="auth-done"){ DEMO&&DEMO.setSession({notifs:false}); finishAuth(); return; }
  if(a==="wallet"){ S.sheet={type:"wallet",ticketId:v}; renderLayer(); return; }
  if(a==="payouts"){ S.sheet={type:"payouts",step:0}; renderLayer(); return; }
  if(a==="payout-go"){ const sh=S.sheet; sh.busy=true; renderLayer(); setTimeout(()=>{ sh.busy=false; sh.step=Math.min(3,(sh.step||0)+(sh.step===1?2:1)); if(sh.step>=3){ DEMO&&DEMO.setSession({payouts:true}); render(); toast("Payouts ready. Same night from your 2nd event."); } renderLayer(); },900); return; }
  if(a==="scan"){ S.sheet={type:"scan",eventId:v}; renderLayer(); setTimeout(doScan,1500); return; }
  if(a==="scan-next"){ S.sheet.result=null; renderLayer(); setTimeout(doScan,1300); return; }
  if(a==="rate"){ S.rate.score=Number(v); render(); return; }
  if(a==="ratetag"){ const T=S.rate.tags; S.rate.tags=T.includes(v)?T.filter(x=>x!==v):T.concat([v]); render(); return; }
  if(a==="rate-send"){ const R=S.rate; if(S.db&&R&&R.score){ S.db.doc("ratings/"+makeId("r")).set({eventId:R.eid,by:S.me.id,score:R.score,tags:R.tags,at:Date.now()}).catch(()=>{}); } S.rate=null; burst(innerWidth/2,innerHeight/2); toast("Thanks. Their next one lands in your Drops."); go("discover"); return; }
  if(a==="demo-step"){ S.sheet=null; renderLayer(); demoStep(v); return; }
  if(a==="fextras"){ const d=el.closest("details"); if(d&&S.form) S.form.extrasOpen=!d.open; return; }
  if(a==="free"){ S.free=!S.free; S.stack=0; render(); return; }
  if(a==="save"){ if(!S.me.id) return toast("Sign in to save events."); const sv=savedIds(), on=sv.includes(v); if(!on){ const r=el.getBoundingClientRect(); burst(r.left+r.width/2,r.top+r.height/2); } saveProfile({saved:on?sv.filter(x=>x!==v):sv.concat([v]).slice(-200)}).then(()=>softRender()); toast(on?"Removed from Saved.":"Saved to Tickets. We'll remind you."); render(); const hb=document.querySelector('.heartbtn[data-v="'+v+'"]')||document.querySelector('[data-act="save"][data-v="'+v+'"]'); if(hb&&!on){ hb.classList.add("popd"); } return; }
  if(a==="fban-rm"){ S.form.banner=""; S.form.banChanged=true; S.form.banErr=""; render(); return; }
  if(a==="theme"){ try{ localStorage.setItem("poping.theme",v); }catch(e){} applyTheme(); render(); return; }
  if(a==="fpub"){ S.form.public=v==="1"; render(); return; }
  if(a==="frot"){ S.form.rotating=!S.form.rotating; render(); return; }
});
let sendTimer=null;
document.addEventListener("input",(ev)=>{
  const t=ev.target;
  if(t.id==="otpIn"){ const d=t.value.replace(/\D/g,"").slice(0,6); if(t.value!==d) t.value=d; if(d.length===6){ const a2=S.auth||{}; if(d===a2.code){ a2.bad=false; S.push=null; renderLayer(); toast("Verified."); go("about"); } else { a2.bad=true; render(); const i=$("#otpIn"); if(i){ i.focus(); } } } return; }
  if(t.id==="q"){ S.q=t.value; $("#results").innerHTML=searchResults(); return; }
  if(t.id==="doorQ"){ S.doorQ=t.value; refreshGuests(); return; }
  if(t.id==="sendQ" && S.sheet){ S.sheet.q=t.value; S.sheet.loading=true; const h=$("#sendHits"); if(h) h.innerHTML=sendHits(); clearTimeout(sendTimer);
    sendTimer=setTimeout(async()=>{ if(!S.user||!S.sheet) return; const q=S.sheet.q; const hits=q.trim()?await S.user.search(q):[]; if(!S.sheet||S.sheet.q!==q) return; S.sheet.hits=hits; S.sheet.loading=false; const hh=$("#sendHits"); if(hh){ hh.innerHTML=sendHits(); fillSendNames(); } },250); return; }
  if(t.dataset && t.dataset.f && S.form){ S.form[t.dataset.f]=t.value; if(t.dataset.f==="name"){ const p=$("#preview"); if(p) p.innerHTML=previewHTML(); } if(["price","capacity"].includes(t.dataset.f)){ const fe=$("#fees"); if(fe) fe.innerHTML=feeHTML(); } }
});
document.addEventListener("change",(ev)=>{ const t=ev.target;
  if(t.id==="fBanner" && S.form){ const file=t.files&&t.files[0]; if(!file) return; const f=S.form; f.banBusy=true; f.banErr=""; render();
    readBanner(file).then(src=>{ f.banner=src; f.banChanged=true; }).catch(err=>{ f.banErr = err&&err.message==="big" ? "That image is too big even after shrinking. Try a smaller one." : "Couldn't read that file. Try a JPG or PNG."; }).finally(()=>{ f.banBusy=false; if(S.form===f) render(); });
    return; }
  if(t.dataset&&t.dataset.f&&S.form) S.form[t.dataset.f]=t.value; });
/* Forms are handled in script, not by native submission: sandboxed frames may block form submit events. */
async function handleForm(f){
  if(f.id==="createForm"){ createParty(); return; }
  if(f.id==="doorForm"){ checkDoor($("#doorIn").value); return; }
  if(f.id==="compForm"){ const n=$("#compName").value.trim(), q=Math.max(1,Math.min(10,Number($("#compQty").value)||1)); if(!n) return; const id=makeId("t"); try{ await S.db.doc("tickets/"+id).set({eventId:S.param,holderId:null,guestName:n,comp:true,qty:q,unit:0,total:0,via:"comp",createdAt:Date.now(),checkedIn:0,status:"active"}); toast("Added "+n+" to the guest list."); }catch(e){ toast("Couldn't add. Try again."); } return; }
  if(f.id==="phoneForm"){ const raw=$("#phIn").value, dg=raw.replace(/\D/g,"").replace(/^1(?=\d{10}$)/,""); S.auth=S.auth||{}; S.auth.phone=raw;
    if(dg.length!==10){ S.auth.err="Enter a 10-digit US number."; render(); return; }
    S.auth.err=""; S.auth.phone="("+dg.slice(0,3)+") "+dg.slice(3,6)+"-"+dg.slice(6); S.auth.code=String(100000+Math.floor(Math.random()*900000)); S.auth.bad=false; go("otp");
    setTimeout(()=>{ pushN("Your Poping code is "+S.auth.code,"It expires in 10 minutes. Tap to fill it in.",null,S.auth.code); const i=$("#otpIn"); if(i) i.focus(); },900); return; }
  if(f.id==="aboutForm"){ const fn=$("#fnIn").value.trim(), ln=$("#lnIn").value.trim(), dob=$("#dobIn").value; S.auth=Object.assign(S.auth||{},{first:fn,last:ln,dob});
    if(!fn){ S.auth.err="Add your first name."; render(); return; }
    const d=new Date(dob+"T12:00"); if(!dob||isNaN(d)){ S.auth.err="Add your birthday."; render(); return; }
    const age=(Date.now()-d.getTime())/(365.25*864e5); if(age<18){ S.auth.err="Poping is for people 18 and over."; render(); return; }
    const name=(fn+" "+ln).trim(); DEMO&&DEMO.setSession({name,phone:S.auth.phone}); S.me.name=name; if(S.me.id){ S.names[S.me.id]=name; } go("friends"); return; }
  if(f.id==="codeForm"){ const c=$("#codeIn").value.trim().toUpperCase().replace(/\s+/g,""); const e=S.events.find(x=>x.public===false&&!isCancelled(x)&&String(x.code||"").toUpperCase()===c&&!isOver(x)); if(e){ S.via="code"; go("p-"+e.id); } else { $("#codeErr").textContent=c?"That code didn't open anything. Check the invite for typos.":"Type the code from your invite."; } return; }
  if(f.id==="reportForm"){ const txt=$("#repTxt").value.trim(); if(!txt) return; try{ await S.db.collection("reports").add({text:txt.slice(0,1000),by:S.me.id,at:Date.now()}); $("#repTxt").value=""; toast("Report sent. We'll look within the hour."); }catch(e){ toast("Couldn't send. Try again."); } return; }
}
document.addEventListener("submit",(ev)=>{ ev.preventDefault(); handleForm(ev.target); });
document.addEventListener("click",(ev)=>{ const sb=ev.target.closest('form button[type="submit"]'); if(!sb) return; ev.preventDefault(); handleForm(sb.form); },true);
document.addEventListener("keydown",(ev)=>{ if(ev.key==="Escape" && S.sheet){ S.sheet=null; renderLayer(); return; }
  if(ev.key==="Enter" && !ev.isComposing){ const t=ev.target; if(t && t.form && t.tagName==="INPUT" && !["checkbox","radio","file"].includes(t.type)){ ev.preventDefault(); handleForm(t.form); } } });

/* ---------- boot ---------- */
async function boot(){
  applyTheme(); setInterval(applyTheme,60000);
  route();
  if(!RT || typeof RT.use!=="function"){ S.failed=true; render(); return; }
  const [db,user]=await Promise.all([RT.use("db"),RT.use("user")]);
  if(!db){ S.failed=true; render(); return; }
  S.db=db; S.user=user; S.ok=true;
  try{ const me=user?await user.me():null; if(me){ S.me={id:me.id,name:me.name||""}; if(me.id){ S.names[me.id]=me.name||""; S.avatars[me.id]=me.avatarUrl||""; } } }catch(e){}
  const onErr=()=>toast("Live updates paused. Reopen to refresh.");
  db.collection("events").limit(800).onSnapshot((s)=>{ S.events=s.docs.map(d=>Object.assign({id:d.id},d.data())); S.loaded.events=true; softRender(); }, onErr);
  db.collection("tickets").limit(1000).onSnapshot((s)=>{ S.tickets=s.docs.map(d=>Object.assign({id:d.id},d.data())); S.loaded.tickets=true; softRender(); }, onErr);
  db.collection("profiles").limit(1000).onSnapshot((s)=>{ const p={}; s.docs.forEach(d=>p[d.id]=d.data()); S.profiles=p; S.loaded.profiles=true; softRender(); }, onErr);
  db.collection("banners").limit(400).onSnapshot((s)=>{ const b={}; s.docs.forEach(d=>b[d.id]=d.data()); S.banners=b; softRender(); }, onErr);
  db.collection("waitlist").limit(1000).onSnapshot((s)=>{ S.waits=s.docs.map(d=>Object.assign({id:d.id},d.data())); softRender(); }, onErr);
}
boot();
})();
